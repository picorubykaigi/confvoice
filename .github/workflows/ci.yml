name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Setup DB
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/confvoice_test
          RAILS_ENV: test
        run: bin/rails db:create db:schema:load

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/confvoice_test
          RAILS_ENV: test
        run: |
          bin/rails zeitwerk:check
          bin/rails assets:precompile
          bin/rails test
