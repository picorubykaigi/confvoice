services:
  - type: web
    name: confvoice
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: confvoice-db
          property: connectionString
      - key: CACHE_DATABASE_URL
        fromDatabase:
          name: confvoice-db
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: confvoice-db
          property: connectionString
      - key: CABLE_DATABASE_URL
        fromDatabase:
          name: confvoice-db
          property: connectionString
      - key: CONFVOICE_OGP_IMAGE_UPLOAD_ENABLED
        value: "false"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: SOLID_QUEUE_THREADS
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"

databases:
  - name: confvoice-db
    plan: free
    region: singapore
    ipAllowList: []
